name: Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Kod ve testleri doğrula
        run: npm run verify

      - name: Mojang ve Fabric kaynaklarını doğrula
        run: npm run verify:remote

      - name: Oyunu ve Java'yı gerçekten kurarak doğrula
        run: npm run verify:game

      - name: Windows kurulum dosyasını üret
        run: npm run dist:win

      - name: Paketlenmiş launcher açılış testi
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1

      - name: EXE dosyasını yükle
        uses: actions/upload-artifact@v7
        with:
          name: KiraziumLauncher-Windows
          path: release/KiraziumLauncher-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Doğrudan EXE indirme bağlantısını yayınla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = Get-ChildItem "release/KiraziumLauncher-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Kurulum EXE dosyası bulunamadı."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName --clobber
          } else {
            gh release create $tag $installer.FullName --target $env:GITHUB_SHA --title "Kirazium Launcher $tag" --notes-file RELEASE_NOTES.md
          }

      - name: Doğrulama sonucunu commit'e yaz
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_SHA: ${{ github.sha }}
          RESULT_REPOSITORY: ${{ github.repository }}
          RESULT_RUN_ID: ${{ github.run_id }}
          RESULT_JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:RESULT_JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $targetUrl = "$env:GITHUB_SERVER_URL/$env:RESULT_REPOSITORY/actions/runs/$env:RESULT_RUN_ID"
          gh api `
            --method POST `
            -H 'Accept: application/vnd.github+json' `
            "repos/$env:RESULT_REPOSITORY/statuses/$env:RESULT_SHA" `
            -f state=$state `
            -f context='Kirazium Launcher / Windows EXE' `
            -f description="Windows doğrulaması: $env:RESULT_JOB_STATUS" `
            -f target_url=$targetUrl
